# Evaluación externa prerregistrada (misión 2.1) en la nube de GitHub.
# Se lanza A MANO (Actions → «Validación externa» → Run workflow) y solo publica métricas como artefacto privado.
# Los datos de INGEMMET se descargan de la fuente oficial dentro de la máquina temporal y NO se suben ni se publican.
name: Validación externa
on:
  workflow_dispatch:
    inputs:
      zona:
        description: "Zona externa (N = Carhuaz–Yungay, E = Callejón de Conchucos)"
        required: true
        default: "N"
        type: choice
        options: ["N", "E"]
permissions:
  contents: read
concurrency:
  group: validacion-externa
  cancel-in-progress: false
jobs:
  evaluar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      NEURO_PROFILE: estandar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Instalar dependencias (versiones exactas)
        run: python -m pip install -r backend/requirements-lock.txt
      - name: Pruebas del backend (el método debe pasar antes de evaluar)
        run: python -m pytest tests/backend -q -p no:cacheprovider
      - name: Evaluación externa prerregistrada
        run: python scripts/ci_validacion_externa.py --zona ${{ inputs.zona }} --salida salida
      - name: Guardar métricas (artefacto privado, sin datos crudos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacion-externa-${{ inputs.zona }}-${{ github.run_id }}
          path: salida/
          retention-days: 90
          if-no-files-found: warn
